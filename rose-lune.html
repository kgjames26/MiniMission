<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140f3a">
<title>Mini Mission · Rose sur la Lune</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140f3a; touch-action: none; -webkit-user-select: none; user-select: none; font-family: "Baloo 2", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  .hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .chip { background: rgba(255,255,255,.92); border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: clamp(15px, 3.6vmin, 22px); color: #3b2f7a; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .chip.pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.25); } }
  .close { pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); font-size: 22px; color: #3b2f7a; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .sp { flex: 1; }
  .pad { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 14px; align-items: flex-end; }
  .pad.l { left: max(16px, env(safe-area-inset-left)); }
  .pad.r { right: max(16px, env(safe-area-inset-right)); }
  .b { width: clamp(64px, 17vmin, 100px); height: clamp(64px, 17vmin, 100px); border-radius: 50%; border: 0; font-size: clamp(28px, 8vmin, 44px); color: #fff;
       background: linear-gradient(#69d36a, #2f9c3b); box-shadow: 0 6px 0 #1f6e2a, 0 10px 18px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; }
  .b.on { transform: translateY(4px); box-shadow: 0 2px 0 #1f6e2a; }
  .b.fly { background: linear-gradient(#ffb04a, #f2702c); box-shadow: 0 6px 0 #b4471a, 0 10px 18px rgba(0,0,0,.35); width: clamp(84px, 23vmin, 130px); height: clamp(84px, 23vmin, 130px); }
  .b.fly.on { box-shadow: 0 2px 0 #b4471a; }
  .b.shoot { background: linear-gradient(#8fe3ff, #3aa6e8); box-shadow: 0 6px 0 #1f6fa8, 0 10px 18px rgba(0,0,0,.35); }
  .b.shoot.on { box-shadow: 0 2px 0 #1f6fa8; }
  #stickzone { position: fixed; left: 0; bottom: 0; width: 55vw; top: 64px; touch-action: none; }
  .stick { position: fixed; width: clamp(150px, 36vmin, 220px); height: clamp(150px, 36vmin, 220px); margin: calc(clamp(150px, 36vmin, 220px) / -2) 0 0 calc(clamp(150px, 36vmin, 220px) / -2); pointer-events: none; transition: opacity .2s; }
  .stick .ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18) 0 38%, rgba(255,255,255,.08) 39% 100%); border: 4px solid rgba(255,255,255,.55); box-shadow: 0 0 0 6px rgba(120,90,255,.18); }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; margin: -22% 0 0 -22%; border-radius: 50%; background: linear-gradient(#ffb04a, #f2702c); box-shadow: 0 5px 0 #b4471a, 0 8px 16px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 7vmin, 40px); }
  .stick .arrow { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 26px solid rgba(255,255,255,.9); transform-origin: 50% 100%; opacity: 0; margin: -26px 0 0 -16px; }
  .stick.idle { opacity: .55; }
  .stick.idle .knob { animation: hint 1.6s ease-in-out infinite; }
  @keyframes hint { 0%, 100% { transform: translate(0, 0); } 30% { transform: translate(40%, -35%); } 60% { transform: translate(40%, 0); } }
  .big-shoot { width: clamp(84px, 23vmin, 130px); height: clamp(84px, 23vmin, 130px); font-size: clamp(36px, 10vmin, 56px); }
  .ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(15,10,50,.55); z-index: 10; }
  .ov.show { display: flex; }
  .card { background: #fff; border-radius: 28px; padding: clamp(14px, 3vmin, 26px); width: min(92vw, 720px); box-shadow: 0 12px 40px rgba(0,0,0,.4); text-align: center; animation: pop .3s; }
  .q { font-size: clamp(17px, 4.2vmin, 26px); font-weight: 800; color: #3b2f7a; margin: 4px 8px 14px; line-height: 1.25; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vmin, 16px); }
  .opt { border: 4px solid #d9d3ff; background: #f6f3ff; border-radius: 22px; padding: 10px 6px; font-size: clamp(14px, 3.4vmin, 20px); font-weight: 800; color: #3b2f7a; }
  .opt i { display: block; font-style: normal; font-size: clamp(44px, 13vmin, 80px); line-height: 1.1; }
  .opt.good { border-color: #4cc95a; background: #e7ffe9; }
  .opt.no { animation: no .4s; }
  @keyframes no { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .row { display: flex; gap: 12px; justify-content: center; margin-top: 14px; }
  .big { border: 0; border-radius: 999px; padding: 12px 22px; font-size: clamp(18px, 4.4vmin, 26px); font-weight: 900; color: #fff; background: linear-gradient(#ffb04a, #f2702c); box-shadow: 0 5px 0 #b4471a; }
  .big.alt { background: linear-gradient(#8f7bff, #5b47d6); box-shadow: 0 5px 0 #3b2c99; }
  .say { border: 0; background: #ede9ff; border-radius: 50%; width: 52px; height: 52px; font-size: 24px; }
  .stats { display: flex; gap: 12px; justify-content: center; font-size: clamp(20px, 5vmin, 30px); font-weight: 900; color: #3b2f7a; margin: 8px 0; flex-wrap: wrap; }
  .title { font-size: clamp(26px, 7vmin, 44px); font-weight: 900; color: #f2702c; margin: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <button class="close" id="quit" aria-label="Retour">✕</button>
  <span class="chip" id="cStars">⭐ 0</span>
  <span class="chip" id="cLetters">🔤 0</span>
  <span class="chip" id="cFriends">💛 0</span>
  <span class="sp"></span>
  <span class="chip">🌙 La Lune</span>
</div>
<div id="stickzone" aria-label="Joystick : glisser le pouce pour marcher et voler"></div>
<div id="stick" class="stick idle"><div class="ring"></div><div class="arrow" id="sarrow"></div><div class="knob" id="sknob">🚀</div></div>

<div class="ov" id="end"><div class="card"><p class="title">Bravo, Rose !</p><div class="stats" id="estats"></div><div class="row"><button class="big alt" id="again">↻ Rejouer</button><button class="big" id="home">🏠</button></div></div></div>
<script src="i18n.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  // ================= images =================
  const V = '1';
  const roseImg = new Image(); roseImg.src = 'assets/rose.webp?v=' + V;
  const alienImg = new Image(); alienImg.src = 'assets/aliens.webp?v=' + V;
  const monImg = new Image(); monImg.src = 'assets/monsters.webp?v=' + V;
  let RF = null, AF = null;
  fetch('assets/rose.json?v=' + V).then(r => r.json()).then(j => { RF = j; });
  fetch('assets/aliens.json?v=' + V).then(r => r.json()).then(j => { AF = j; });

  // ================= voix et sons =================
  let voiceOn = 'speechSynthesis' in window, speaking = 0;
  function say(text, important = true) {
    if (!voiceOn) return;
    if (!important && performance.now() < speaking) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = .95; u.pitch = 1.08;
      const v = speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); speaking = performance.now() + 1200 + text.length * 70; } catch {}
  }
  let AC = null;
  function tone(f0, f1, dur, type = 'sine', vol = .08, at = 0) {
    try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
      const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * .9);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05); } catch {}
  }
  const sfx = {
    star: () => { tone(1320, 1320, .12, 'sine', .06); tone(1760, 1760, .18, 'sine', .05, .07); },
    letter: () => { tone(660, 990, .18, 'triangle', .07); },
    bubble: () => { tone(500, 1100, .14, 'sine', .06); },
    pop: () => { tone(900, 300, .12, 'triangle', .08); },
    friend: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .2, 'sine', .06, i * .07)); },
    bonk: () => { tone(220, 160, .12, 'triangle', .06); },
    good: () => { [784, 988, 1175].forEach((f, i) => tone(f, f, .25, 'sine', .07, i * .1)); },
    no: () => { tone(330, 260, .2, 'triangle', .05); },
  };

  // ================= réglages de Rose (unités : pixels de sa planche, ~210 px du casque aux pieds) =================
  const WALK = 205, WALK_ACC = 900, WALK_DEC = 1400, STEP_PX = 13.2, WALK_START = 4;
  const FLY = 400, DASH_AT = 300, FLY_ACC = 1000, RISE = 330, SINK = 270;
  const FADE = .07, STOP_FADE = .11, RW = 40, RH = 196;   // demi-largeur et hauteur de Rose pour les collisions
  const A = { idle: { n: 10, fps: 6, loop: 'pp' }, hover: { n: 30, fps: 13, loop: 'loop' }, fly: { n: 27, fps: 14, loop: 'loop' }, dash: { n: 30, fps: 15, loop: 'pp' },
              lift: { n: 20, fps: 26, loop: 'once' }, up: { n: 18, fps: 24, loop: 'once' }, down: { n: 20, fps: 26, loop: 'once' }, drop: { n: 20, fps: 28, loop: 'once', src: 'lift', rev: true },
              win: { n: 30, fps: 13, loop: 'once' }, walk: { n: 30, loop: 'loop' } };
  function sample(name, pos) {
    const a = A[name], n = a.n, src = 'rose_' + (a.src || name); let q;
    if (a.loop === 'loop') q = ((pos % n) + n) % n;
    else if (a.loop === 'pp') { const P = 2 * n - 2, p = ((pos % P) + P) % P; q = p < n - 1 ? p : P - p; }
    else q = Math.max(0, Math.min(n - 1, pos));
    let i = Math.floor(q), j = a.loop === 'loop' ? (i + 1) % n : Math.min(n - 1, i + 1); const mix = q - i;
    if (a.rev) { i = n - 1 - i; j = n - 1 - j; }
    return { k: src + i, k2: src + j, mix };
  }
  const topOf = (k) => RF[k].top;
  // En vol, les trois animations se mélangent selon la vitesse ; chacune s'incline vers l'angle de la suivante
  // (inclinaison mesurée dans les GIF : stationnaire ≈ 8°, vol lent ≈ 11°, vol rapide ≈ 32° vers l'avant), avec un léger penché en plus quand ça va vite.
  const AIR = ['hover', 'fly', 'dash'], AIR_V = [0, 170, 370], AIR_A = [-8, -11, -32], PIVOT = 105;

  // ================= le niveau de la Lune =================
  const L = 9200, CAVE0 = 4650, CAVE1 = 6450, CEIL = 640;
  // solides : x, y (bas), w, h — y = hauteur au-dessus du sol
  const solids = [
    { x: 950, y: 0, w: 170, h: 300, kind: 'rock' },
    { x: 2250, y: 250, w: 320, h: 40, kind: 'slab' },
    { x: 3250, y: 0, w: 210, h: 380, kind: 'rock' },
    { x: CAVE0, y: CEIL, w: CAVE1 - CAVE0, h: 3000, kind: 'ceil' },
    { x: 4950, y: 0, w: 150, h: 280, kind: 'mite' },
    { x: 5350, y: 310, w: 150, h: CEIL - 310, kind: 'tite' },
    { x: 5750, y: 0, w: 160, h: 300, kind: 'mite' },
    { x: 6150, y: 330, w: 150, h: CEIL - 330, kind: 'tite' },
    { x: 7650, y: 260, w: 300, h: 40, kind: 'slab' },
  ];
  const overlaps = (s, x0, x1, y0, y1) => x1 > s.x && x0 < s.x + s.w && y1 > s.y && y0 < s.y + s.h;
  function surfaceAt(x, y) {                 // le plus haut « sol » sous les pieds
    let best = 0;
    for (const s of solids) { const top = s.y + s.h; if (s.kind === 'ceil' || s.kind === 'tite') continue;
      if (x + RW * .6 > s.x && x - RW * .6 < s.x + s.w && top <= y + 6 && top > best) best = top; }
    return best;
  }
  // étoiles
  const stars = [];
  const arc = (x0, x1, y0, hgt, n) => { for (let i = 0; i < n; i++) { const t = n === 1 ? .5 : i / (n - 1); stars.push({ x: x0 + (x1 - x0) * t, y: y0 + Math.sin(t * Math.PI) * hgt, got: false }); } };
  arc(300, 700, 60, 60, 5); arc(900, 1170, 360, 80, 5); arc(2270, 2550, 330, 30, 4); arc(3200, 3510, 440, 90, 5);
  arc(4800, 5250, 380, 60, 5); arc(5500, 5900, 380, 40, 5); arc(6250, 6420, 150, 50, 3); arc(7000, 7400, 80, 120, 5); arc(7670, 7930, 340, 30, 4); arc(8400, 8700, 70, 60, 4);
  // lettres (l'alphabet de la langue choisie)
  const ABC = (MM.i18n && MM.i18n.alphabet ? MM.i18n.alphabet() : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')).slice(0, 26);
  const letters = ABC.map((l, i) => { const x = 450 + i * ((L - 900) / ABC.length); let y = 110 + ((i * 97) % 3) * 110;
    for (const s of solids) if (s.kind !== 'ceil' && x > s.x - 40 && x < s.x + s.w + 40) y = Math.max(y, s.kind === 'tite' ? 120 : s.y + s.h + 90);
    if (x > CAVE0 && x < CAVE1) y = Math.min(y, CEIL - 90);
    return { l, x, y, got: false }; });
  // extraterrestres farceurs
  const aliens = [
    { type: 'glouglou', x: 1500, x0: 1300, x1: 1750, y: 0 },
    { type: 'boing', x: 2700, x0: 2620, x1: 2900, y: 0 },
    { type: 'zap', x: 3900, y0: 330, y: 330 },
    { type: 'glouglou', x: 7150, x0: 6950, x1: 7450, y: 0 },
    { type: 'boing', x: 8050, x0: 7980, x1: 8250, y: 0 },
    { type: 'zap', x: 8850, y0: 360, y: 360 },
  ].map((a, i) => ({ ...a, id: i, dir: 1, t: Math.random() * 3, state: 'farceur', bt: 0, cool: 2 + i }));
  // amis enfermés dans des petites prisons (nos monstres : case farceur → case ami de monsters.webp)
  const cages = [ { x: 1950, f: 0, a: 5 }, { x: 4250, f: 10, a: 11 }, { x: 7300, f: 22, a: 23 }, { x: 8600, f: 24, a: 25 } ].map(c => ({ ...c, open: false, t: 0 }));
  // caisses « ? » : une devinette sur l'espace
  const boxes = [ { x: 2950, y: 260 }, { x: 6750, y: 240 }, { x: 8350, y: 300 } ].map(b => ({ ...b, done: false }));
  const ROCKET = L - 280;
  const friends = [];                       // ceux qui suivent Rose
  const slime = [], bubbles = [], puffs = [];
  const RIDDLES = [
    { q: 'Comment s’appelle l’astre qui tourne autour de la Terre et brille la nuit ?', o: [['🌙', 'la Lune'], ['☀️', 'le Soleil'], ['🪐', 'Saturne']], a: 0, fact: 'Oui ! La Lune tourne autour de la Terre. C’est là que tu es, avec Rose !' },
    { q: 'Qui a marché le premier sur la Lune ?', o: [['🧑‍🚀', 'un astronaute'], ['🐶', 'un chien'], ['🤖', 'un robot']], a: 0, fact: 'Bravo ! C’était l’astronaute Neil Armstrong, en 1969. Il a laissé ses traces de pas sur la Lune.' },
    { q: 'Le premier homme dans l’espace s’appelait Youri Gagarine. Dans quoi est-il monté ?', o: [['🚀', 'une fusée'], ['🎈', 'un ballon'], ['🚲', 'un vélo']], a: 0, fact: 'Oui ! En 1961, Youri Gagarine a fait le tour de la Terre dans une fusée.' },
    { q: 'Quel animal a fait le tour de la Terre dans l’espace, avant les astronautes ?', o: [['🐶', 'un chien'], ['🐘', 'un éléphant'], ['🐟', 'un poisson']], a: 0, fact: 'Oui ! Une petite chienne, Laïka, est allée dans l’espace en 1957.' },
    { q: 'Quelle planète est rouge ?', o: [['🔴', 'Mars'], ['🔵', 'Neptune'], ['🌍', 'la Terre']], a: 0, fact: 'Bravo ! Mars est rouge, à cause de sa poussière rouge.' },
    { q: 'Quelle planète a de grands anneaux ?', o: [['🪐', 'Saturne'], ['🌙', 'la Lune'], ['☀️', 'le Soleil']], a: 0, fact: 'Oui ! Saturne a de grands anneaux faits de glace et de cailloux.' },
    { q: 'Qu’est-ce qui emmène les astronautes dans l’espace ?', o: [['🚀', 'une fusée'], ['🚗', 'une voiture'], ['⛵', 'un bateau']], a: 0, fact: 'Oui ! Il faut une très grande fusée pour aller dans l’espace.' },
    { q: 'Où vivent les astronautes qui tournent autour de la Terre ?', o: [['🛰️', 'dans une station spatiale'], ['🏰', 'dans un château'], ['⛺', 'sous une tente']], a: 0, fact: 'Oui ! Dans la station spatiale, les astronautes flottent et dorment attachés à leur sac de couchage.' },
    { q: 'Qu’est-ce qui roule sur Mars pour l’explorer ?', o: [['🤖', 'un robot'], ['🛹', 'un skate'], ['🐴', 'un cheval']], a: 0, fact: 'Bravo ! Des robots roulent sur Mars et prennent des photos pour les savants.' },
    { q: 'Sur quelle planète vivons-nous ?', o: [['🌍', 'la Terre'], ['🔴', 'Mars'], ['🪐', 'Saturne']], a: 0, fact: 'Oui ! La Terre, notre maison, est la planète bleue.' },
    { q: 'Sur la Lune, on est très léger. Comment peut-on sauter ?', o: [['🦘', 'très haut'], ['🐌', 'pas du tout'], ['🪨', 'comme un caillou']], a: 0, fact: 'Oui ! Sur la Lune, les astronautes faisaient de grands bonds.' },
    { q: 'Quelle est la plus grosse planète ?', o: [['🟠', 'Jupiter'], ['⚪', 'Mercure'], ['🌙', 'la Lune']], a: 0, fact: 'Bravo ! Jupiter est la plus grosse planète. On pourrait y mettre plus de mille Terre !' },
  ];
  const quizPick = RIDDLES.map((r, i) => i).sort(() => Math.random() - .5).slice(0, 3);
  // les caisses : la 1re parle toujours de la Lune ou de son premier explorateur
  if (!quizPick.includes(1)) quizPick[0] = 1;

  // ================= Rose =================
  const rose = { x: 420, y: 0, vx: 0, vy: 0, vs: 0, face: 1, mode: 'ground', anim: null, walkDist: 0, t: 0, airPose: 'hover', airT: 0, walking: false, base: 0, cool: 0, bump: 0 };
  let shownSet = null, shown = null, fadeFrom = null, fadeT = 9, fadeLen = FADE, fadeGy = 0, lastGy = 0, stopFade = false;
  function play(name, then, opts = {}) { rose.anim = { name, t: 0, then, ...opts }; if (name !== 'win') rose.mode = 'trans'; }

  // ================= commandes =================
  const key = { l: false, r: false, fly: false, down: false, shoot: false };
  let paused = false, finished = false;
  const hold = (id, k) => { const b = document.getElementById(id);
    const on = (e) => { e.preventDefault(); key[k] = true; b.classList.add('on'); if (k === 'shoot') shoot(); }, off = (e) => { e.preventDefault(); key[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off); };
  hold('bs', 'shoot');
  // ----- joystick flottant : il apparaît là où le pouce se pose (moitié gauche), suit le doigt et disparaît quand on lâche -----
  // haut = voler, bas = redescendre vite, côtés = marcher / avancer ; grande zone morte au centre pour les petits pouces
  const zone = $('#stickzone'), stick = $('#stick'), knob = $('#sknob'), arrowEl = $('#sarrow');
  let sid = null, sx0 = 0, sy0 = 0;
  const restStick = () => { stick.classList.add('idle'); stick.style.left = (Math.max(110, innerWidth * .14)) + 'px'; stick.style.top = (innerHeight - Math.max(110, innerHeight * .2)) + 'px'; knob.style.transform = ''; arrowEl.style.opacity = 0; };
  restStick(); addEventListener('resize', () => { if (sid === null) restStick(); });
  function stickMove(x, y) {
    const R = stick.offsetWidth * .5, dx = x - sx0, dy = y - sy0, d = Math.hypot(dx, dy), k = Math.min(1, d / R);
    const nx = d ? dx / d * k : 0, ny = d ? dy / d * k : 0;
    knob.style.transform = `translate(${nx * R * .62}px, ${ny * R * .62}px)`;
    const dead = .26;
    key.l = nx < -dead; key.r = nx > dead; key.fly = ny < -dead * 1.2; key.down = ny > .45;
    if (k > dead) { arrowEl.style.opacity = 1; arrowEl.style.transform = `rotate(${Math.atan2(dx, -dy)}rad) translateY(${-R * .78}px)`; } else arrowEl.style.opacity = 0;
  }
  zone.addEventListener('pointerdown', (e) => { if (sid !== null) return; e.preventDefault(); sid = e.pointerId; zone.setPointerCapture(sid); sx0 = e.clientX; sy0 = e.clientY;
    stick.classList.remove('idle'); stick.style.left = sx0 + 'px'; stick.style.top = sy0 + 'px'; stickMove(sx0, sy0); });

    ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7a4a10'; ctx.beginPath(); ctx.arc(-r * .2, -r * .05, r * .08, 0, 7); ctx.arc(r * .2, -r * .05, r * .08, 0, 7); ctx.fill(); ctx.restore();
  }
  const COLS = ['#ff6b8a', '#ffa94a', '#58c96b', '#4aa8ff', '#9a6bff'];
  function drawItems(time) {
    for (const s of stars) if (!s.got) { const x = SX(s.x); if (x > -40 && x < W + 40) drawStar(x, SY(s.y), 22 * zoom, time, s.x); }
    letters.forEach((l, i) => { if (l.got) return; const x = SX(l.x); if (x < -60 || x > W + 60) return; const y = SY(l.y) + Math.sin(time * 2.5 + i) * 5 * zoom, s = 54 * zoom;
      ctx.fillStyle = COLS[i % 5]; ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, 12 * zoom); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.roundRect(x - s / 2 + 4 * zoom, y - s / 2 + 4 * zoom, s - 8 * zoom, s * .35, 8 * zoom); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(36 * zoom)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l.l, x, y + 2 * zoom); });
    for (const b of boxes) { const x = SX(b.x); if (x < -80 || x > W + 80) continue; const y = SY(b.y) + Math.sin(time * 2 + b.x) * 4 * zoom, s = 70 * zoom;
      ctx.globalAlpha = b.done ? .35 : 1; ctx.fillStyle = '#ffb648'; ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, 14 * zoom); ctx.fill(); ctx.strokeStyle = '#b06a10'; ctx.lineWidth = 4 * zoom; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(46 * zoom)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.done ? '✓' : '?', x, y + 2 * zoom); ctx.globalAlpha = 1; }
    // la fusée d'arrivée
    { const x = SX(ROCKET), y = SY(0), s = zoom; if (x > -200 && x < W + 200) { ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#e9eef7'; ctx.beginPath(); ctx.moveTo(0, -330 * s); ctx.quadraticCurveTo(70 * s, -240 * s, 55 * s, -60 * s); ctx.lineTo(-55 * s, -60 * s); ctx.quadraticCurveTo(-70 * s, -240 * s, 0, -330 * s); ctx.fill();
      ctx.fillStyle = '#ff5d5d'; ctx.beginPath(); ctx.moveTo(-55 * s, -60 * s); ctx.lineTo(-95 * s, 0); ctx.lineTo(-40 * s, -10 * s); ctx.fill(); ctx.beginPath(); ctx.moveTo(55 * s, -60 * s); ctx.lineTo(95 * s, 0); ctx.lineTo(40 * s, -10 * s); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -330 * s); ctx.quadraticCurveTo(40 * s, -290 * s, 48 * s, -250 * s); ctx.lineTo(-48 * s, -250 * s); ctx.quadraticCurveTo(-40 * s, -290 * s, 0, -330 * s); ctx.fill();
      ctx.fillStyle = '#4aa8ff'; ctx.strokeStyle = '#2a5f9e'; ctx.lineWidth = 6 * s; ctx.beginPath(); ctx.arc(0, -180 * s, 26 * s, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); } }
  }
  function drawCage(c, time) {
    const x = SX(c.x), y = SY(0); if (x < -150 || x > W + 150) return; const s = zoom;
    if (!c.open && monImg.complete) { const cw = 400, ch = 264, i = c.f, k = 110 / 254 * s, wob = Math.sin(time * 5 + c.x) * 2 * s;
      ctx.drawImage(monImg, (i % 5) * cw, Math.floor(i / 5) * ch, cw, ch, x - cw * k / 2 + wob, y - (ch - 6) * k - 8 * s, cw * k, ch * k); }
    const lift = c.open ? Math.min(1, c.t * 2) : 0;
    if (lift < 1) { ctx.save(); ctx.globalAlpha = 1 - lift; ctx.translate(0, -lift * 120 * s);
      ctx.fillStyle = '#7b7f99'; ctx.fillRect(x - 70 * s, y - 150 * s, 140 * s, 14 * s); ctx.fillRect(x - 70 * s, y - 10 * s, 140 * s, 10 * s);
      ctx.strokeStyle = '#a7abc4'; ctx.lineWidth = 7 * s; for (let k = -55; k <= 55; k += 22) { ctx.beginPath(); ctx.moveTo(x + k * s, y - 138 * s); ctx.lineTo(x + k * s, y - 10 * s); ctx.stroke(); }
      ctx.fillStyle = '#ffcf4a'; ctx.beginPath(); ctx.arc(x, y - 75 * s, 12 * s, 0, 7); ctx.fill(); ctx.restore(); }
  }
  function drawAlien(a, time) {
    if (!AF || !alienImg.complete) return;
    let name = a.type + '_f1';
    if (a.state === 'farceur') { if (a.type === 'boing') name = a.y > 25 ? 'boing_f2' : 'boing_f1'; else if (a.type === 'zap') name = (a.throwT || 0) > 0 ? 'zap_f2' : 'zap_f1'; else name = Math.floor(a.t * 3.2) % 2 ? 'glouglou_f2' : 'glouglou_f1'; }
    else if (a.state === 'ami') return;
    const f = AF[name], x = SX(a.x), y = SY(a.y); if (x < -150 || x > W + 150) return;
    const k = zoom * ASCALE, sq = a.type === 'boing' && a.y < 25 ? 1 + (25 - a.y) / 25 * .12 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale((a.dir < 0 ? -1 : 1) * k * sq, k / sq);
    if (a.type === 'glouglou' && a.state === 'farceur') ctx.rotate(Math.sin(a.t * 6.4) * .06);
    ctx.drawImage(alienImg, f.x, f.y, f.w, f.h, -f.w / 2, -f.h, f.w, f.h); ctx.restore();
    if (a.state === 'bubble') { const r = Math.max(f.w, f.h) * .62 * zoom, cy = y - f.h * zoom / 2; const g = ctx.createRadialGradient(x - r * .3, cy - r * .3, r * .1, x, cy, r);
      g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.7, 'rgba(170,230,255,.18)'); g.addColorStop(1, 'rgba(255,170,240,.55)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, cy, r, 0, 7); ctx.fill(); }
  }
  function drawFriend(f, time) {
    const x = SX(f.x), y = SY(f.y) - Math.abs(Math.sin(f.t * 5)) * 6 * zoom; if (x < -150 || x > W + 150) return;
    ctx.save(); ctx.translate(x, y);
    if (f.img === 'alien' && AF) { const q = AF[f.cell], k = zoom * .8; ctx.scale((f.face || 1) * k, k); ctx.drawImage(alienImg, q.x, q.y, q.w, q.h, -q.w / 2, -q.h, q.w, q.h); }
    else if (monImg.complete) { const cw = 400, ch = 264, i = f.cell, k = 90 / 254 * zoom; ctx.scale(f.face || 1, 1); ctx.drawImage(monImg, (i % 5) * cw, Math.floor(i / 5) * ch, cw, ch, -cw * k / 2, -(ch - 6) * k, cw * k, ch * k); }
    ctx.restore();
  }
  function drawShots() {
    for (const u of bubbles) { const x = SX(u.x), y = SY(u.y), r = u.r * zoom; const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.6, 'rgba(160,225,255,.45)'); g.addColorStop(1, 'rgba(255,160,240,.8)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    for (const s of slime) { const x = SX(s.x), y = SY(s.y); ctx.fillStyle = '#7fe060'; ctx.strokeStyle = '#3f9a2c'; ctx.lineWidth = 3 * zoom; ctx.beginPath(); ctx.arc(x, y, 14 * zoom, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x - 4 * zoom, y - 4 * zoom, 4 * zoom, 0, 7); ctx.fill(); }
    for (const p of puffs) { const k = p.t / .6, x = SX(p.x), y = SY(p.y); ctx.globalAlpha = 1 - k; ctx.strokeStyle = p.c; ctx.lineWidth = 4 * zoom; ctx.beginPath(); ctx.arc(x, y, (14 + k * 40) * zoom, 0, 7); ctx.stroke();
      ctx.fillStyle = p.c; for (let i = 0; i < 6; i++) { const an = i * Math.PI / 3 + p.x; ctx.beginPath(); ctx.arc(x + Math.cos(an) * (20 + k * 50) * zoom, y + Math.sin(an) * (20 + k * 50) * zoom, 4 * zoom * (1 - k), 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  }
  function roseFrame() {
    const a = rose.anim;
    if (a) return { ...sample(a.name, a.t * A[a.name].fps), set: a.name, ground: true };
    if (rose.mode === 'air') {
      const v = rose.vs, i = v >= AIR_V[1] ? 1 : 0, t0 = Math.max(0, Math.min(1, (v - AIR_V[i]) / (AIR_V[i + 1] - AIR_V[i]))), t = t0 * t0 * (3 - 2 * t0);
      const pa = AIR[i], pb = AIR[i + 1], A1 = sample(pa, rose.t * A[pa].fps), B1 = sample(pb, rose.t * A[pb].fps), da = AIR_A[i + 1] - AIR_A[i];
      return { ...(t < .5 ? A1 : B1), set: 'air', air: { A1, B1, t, rotA: da * t, rotB: -da * (1 - t), extra: -6 * Math.min(1, v / 370) } };
    }
    if (rose.walking) return { ...sample('walk', rose.walkDist / STEP_PX), set: 'walk', ground: true };
    return { ...sample('idle', rose.t * A.idle.fps), set: 'idle', ground: true };
  }
  function drawRose() {
    const f = roseFrame(); if (!RF[f.k]) return;
    const gy = f.ground ? SY(rose.base) : SY(rose.y), px = SX(rose.x);
    if (f.set !== shownSet) { if (shownSet) { fadeFrom = shown; fadeT = 0; fadeGy = lastGy; fadeLen = stopFade ? STOP_FADE : FADE; stopFade = false; } shownSet = f.set; }
    shown = f.mix > .5 ? f.k2 : f.k;
    const surf = SY(surfaceAt(rose.x, (rose.mode === 'air' ? rose.y : rose.base) + 2)), h = f.ground ? 0 : rose.y - surfaceAt(rose.x, rose.y + 2), sh = Math.max(.2, 1 - h / 500);
    ctx.fillStyle = `rgba(30,25,70,${.3 * sh})`; ctx.beginPath(); ctx.ellipse(px, surf + 3, 52 * zoom * sh, 11 * zoom * sh, 0, 0, Math.PI * 2); ctx.fill();
    const draw = (k, alpha, y) => { const q = RF[k]; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(px, y); ctx.scale(rose.face * zoom, zoom); ctx.drawImage(roseImg, q.x, q.y, q.w, q.h, -q.ax, -q.ay, q.w, q.h); ctx.restore(); };
    if (f.air) {                                                        // vol : deux animations, chacune penchée vers l'autre, en fondu selon la vitesse
      const { A1, B1, t, rotA, rotB, extra } = f.air;
      const tilt = (k, alpha, deg) => { if (alpha <= .01) return; const q = RF[k]; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(px, gy - PIVOT * zoom); ctx.rotate(rose.face * (deg + extra) * Math.PI / 180);
        ctx.translate(0, PIVOT * zoom); ctx.scale(rose.face * zoom, zoom); ctx.drawImage(roseImg, q.x, q.y, q.w, q.h, -q.ax, -q.ay, q.w, q.h); ctx.restore(); };
      const aA = Math.min(1, 2 * (1 - t)), aB = Math.min(1, 2 * t);
      const pair = (S, a, deg) => { tilt(S.k, a, deg); if (S.mix > .01 && S.k2 !== S.k) tilt(S.k2, a * S.mix, deg); };
      if (t < .5) { pair(B1, aB, rotB); pair(A1, aA, rotA); } else { pair(A1, aA, rotA); pair(B1, aB, rotB); }
    } else { draw(f.k, 1, gy); if (f.mix > .01 && f.k2 !== f.k) draw(f.k2, f.mix, gy); }
    if (fadeFrom && fadeT < fadeLen) { const k = fadeT / fadeLen; draw(fadeFrom, 1 - k * k * (3 - 2 * k), fadeGy); } else fadeFrom = null;
    lastGy = gy;
  }

  // ================= boucle =================
  let last = performance.now(), started = false;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (RF && AF && roseImg.complete && alienImg.complete) {
      if (!started) { started = true; say('Bienvenue sur la Lune ! Rose doit libérer les amis enfermés par les petits extraterrestres farceurs. Envoie-leur des bulles !'); }
      if (!paused) { update(dt); fadeT += dt; }
      const look = rose.face * 120;
      camX += ((rose.x + look - (W * .4) / zoom) - camX) * Math.min(1, dt * 3.5); camX = Math.max(0, Math.min(L - W / zoom, camX));
      const hy = rose.mode === 'air' ? rose.y : rose.base, ty = Math.max(0, Math.min(CEIL - (GY / zoom) + 60, hy + 230 - GY / zoom * .82));
      camY += (Math.max(0, ty) - camY) * Math.min(1, dt * 3);
      const time = now / 1000;
      drawBg(time); drawGround(); drawSolids(time); drawItems(time);
      cages.forEach(c => drawCage(c, time)); aliens.forEach(a => drawAlien(a, time)); friends.forEach(f => drawFriend(f, time));
      drawRose(); drawShots();
    } else { ctx.fillStyle = '#140f3a'; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  $('#cStars').textContent = '⭐ 0'; $('#cLetters').textContent = '🔤 0'; $('#cFriends').textContent = '💛 0';
  window.__rose = { rose, aliens, cages, boxes, stars, letters, friends, key, got, solids, get paused() { return paused; } };
})();
