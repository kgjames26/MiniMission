<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rose — essai des mouvements</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140f3a; touch-action: none; -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  .pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 14px; }
  .pad.l { left: max(18px, env(safe-area-inset-left)); }
  .pad.r { right: max(18px, env(safe-area-inset-right)); align-items: flex-end; }
  .b { width: clamp(64px, 17vmin, 104px); height: clamp(64px, 17vmin, 104px); border-radius: 50%; border: 0; font-size: clamp(28px, 8vmin, 46px); color: #fff;
       background: linear-gradient(#69d36a, #2f9c3b); box-shadow: 0 6px 0 #1f6e2a, 0 10px 18px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; }
  .b.on { transform: translateY(4px); box-shadow: 0 2px 0 #1f6e2a; }
  .b.fly { background: linear-gradient(#ffb04a, #f2702c); box-shadow: 0 6px 0 #b4471a, 0 10px 18px rgba(0,0,0,.35); width: clamp(84px, 23vmin, 136px); height: clamp(84px, 23vmin, 136px); }
  .b.fly.on { box-shadow: 0 2px 0 #b4471a; }
  .b.win { background: linear-gradient(#ffe46b, #f2b81c); box-shadow: 0 5px 0 #b0800d; width: clamp(50px, 12vmin, 70px); height: clamp(50px, 12vmin, 70px); font-size: clamp(22px, 6vmin, 32px); }
  .tip { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); color: #dfe3ff; font-size: 14px; opacity: .8; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tip">Essai de Rose · ◀ ▶ marcher · 🚀 garder appuyé pour voler, lâcher pour redescendre</div>
<div class="pad l"><button class="b" id="bl" aria-label="Gauche">◀</button><button class="b" id="br" aria-label="Droite">▶</button></div>
<div class="pad r"><button class="b win" id="bw" aria-label="Victoire">★</button><button class="b fly" id="bf" aria-label="Voler">🚀</button></div>
<script>
(() => {
  // ---------- planche de Rose (assets/rose.webp + rose.json) ----------
  const img = new Image(); img.src = 'assets/rose.webp?v=3';
  let F = null; fetch('assets/rose.json?v=3').then(r => r.json()).then(j => { F = j; });
  const N = (p) => { let n = 0; while (F[p + n]) n++; return n; };

  // ---------- réglages (en pixels de la planche : Rose mesure ~230 px du casque aux pieds) ----------
  const WALK = 205;            // marche avec l'exosquelette : lente et posée
  const WALK_ACC = 900, WALK_DEC = 1400;
  const STEP_PX = 13.2;        // distance parcourue par image de marche (pieds qui ne glissent pas)
  // départ et arrêt de la marche sur les images les plus proches de la pose debout (bras le long du corps, pieds rapprochés)
  const WALK_START = 4, STOP_FADE = .11;   // l'arrêt : fondu un peu plus long vers la pose debout
  const FLY = 400, DASH_AT = 300, FLY_ACC = 1000;
  const RISE = 330, SINK = 270;
  const ceil = () => Math.max(120, (GROUND - H * .1) / zoom - 250);   // Rose reste toujours visible en haut de l'écran
  const FADE = .07;            // fondu entre deux animations différentes
  // TOUTES les images des GIF sont gardées ; entre deux images, on fond l'une dans la suivante : le mouvement est continu à 60 images/s.
  // n = images utilisées, fps = vitesse (les GIF d'origine sont à 10 images/s), loop : 'loop' (boucle), 'pp' (aller-retour), 'once'
  const A = { idle: { n: 10, fps: 6, loop: 'pp' }, hover: { n: 30, fps: 13, loop: 'loop' }, fly: { n: 27, fps: 14, loop: 'loop' }, dash: { n: 30, fps: 15, loop: 'pp' },
              lift: { n: 20, fps: 26, loop: 'once' }, up: { n: 18, fps: 24, loop: 'once' }, down: { n: 20, fps: 26, loop: 'once' }, drop: { n: 20, fps: 28, loop: 'once', src: 'lift', rev: true },
              win: { n: 30, fps: 13, loop: 'once' }, walk: { n: 30, loop: 'loop' } };
  const FPS = Object.fromEntries(Object.entries(A).map(([k, v]) => [k, v.fps]));
  // image (et image suivante + mélange) pour une position décimale dans l'animation
  function sample(name, pos) {
    const a = A[name], n = a.n, src = 'rose_' + (a.src || name);
    let q;
    if (a.loop === 'loop') q = ((pos % n) + n) % n;
    else if (a.loop === 'pp') { const P = 2 * n - 2, p = ((pos % P) + P) % P; q = p < n - 1 ? p : P - p; }
    else q = Math.max(0, Math.min(n - 1, pos));
    let i = Math.floor(q), j = a.loop === 'loop' ? (i + 1) % n : Math.min(n - 1, i + 1), mix = q - i;
    if (a.rev) { i = n - 1 - i; j = n - 1 - j; }
    return { k: src + i, k2: src + j, mix };
  }

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, zoom = 1, GROUND = 0;
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; zoom = (H * .30) / 210; }
  addEventListener('resize', resize); resize();

  // ---------- commandes ----------
  const key = { l: false, r: false, fly: false };
  const hold = (id, k) => { const b = document.getElementById(id);
    const on = (e) => { e.preventDefault(); key[k] = true; b.classList.add('on'); }, off = (e) => { e.preventDefault(); key[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off); };
  hold('bl', 'l'); hold('br', 'r'); hold('bf', 'fly');
  document.getElementById('bw').addEventListener('click', () => { if (rose.mode === 'ground' && !rose.anim) play('win', 'ground'); });
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') key.l = true; if (e.key === 'ArrowRight') key.r = true; if (e.key === ' ' || e.key === 'ArrowUp') key.fly = true; });
  addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') key.l = false; if (e.key === 'ArrowRight') key.r = false; if (e.key === ' ' || e.key === 'ArrowUp') key.fly = false; });

  // ---------- Rose ----------
  // mode : 'ground' (au sol), 'air' (en vol), 'trans' (une animation de jonction est en cours)
  // y = hauteur des pieds au-dessus du sol ; en vol, l'image est posée sur cette hauteur
  const rose = { x: 0, y: 0, vx: 0, vy: 0, face: 1, mode: 'ground', anim: null, walkDist: 0, t: 0, airPose: 'hover', airT: 0 };
  let shown = null, fadeFrom = null, fadeT = 0;
  const topOf = (k) => F[k].top;
  function play(name, then, opts = {}) { rose.anim = { name, t: 0, then, ...opts }; if (name !== 'win') rose.mode = 'trans'; }

  function update(dt) {
    const dir = (key.r ? 1 : 0) - (key.l ? 1 : 0);
    if (dir) rose.face = dir;
    rose.t += dt; rose.airT += dt;
    const a = rose.anim;
    if (rose.mode === 'ground') {
      const target = a ? 0 : dir * WALK;
      const acc = Math.abs(target) > Math.abs(rose.vx) || Math.sign(target) !== Math.sign(rose.vx) ? WALK_ACC : WALK_DEC;
      rose.vx += Math.max(-acc * dt, Math.min(acc * dt, target - rose.vx));
      const was = rose.walking;
      if (Math.abs(rose.vx) > 8 && !a) {
        if (!was) rose.walkDist = WALK_START * STEP_PX;                // on démarre sur un pas qui ressemble à l'arrêt
        rose.walking = true; rose.walkDist += Math.abs(rose.vx) * dt;
      } else if (was) {                                                 // elle s'arrête là où elle est : les jambes s'arrêtent avec elle
        rose.walking = false; stopFade = true;
      }
      if (key.fly && !a) {                                       // décollage : depuis la marche ou depuis l'arrêt
        if (Math.abs(rose.vx) > 60) play('up', 'air', { vx0: rose.vx }); else play('lift', 'air');
      }
    } else if (rose.mode === 'air') {
      const ty = key.fly ? RISE : -SINK;
      rose.vy += Math.max(-1300 * dt, Math.min(1300 * dt, ty - rose.vy));
      rose.y = Math.min(ceil(), rose.y + rose.vy * dt); if (rose.y >= ceil() && rose.vy > 0) rose.vy = 0;
      const target = dir * FLY;
      rose.vx += Math.max(-FLY_ACC * dt, Math.min(FLY_ACC * dt, target - rose.vx));
      const sp = Math.abs(rose.vx), want = sp < 60 ? 'hover' : sp < DASH_AT ? 'fly' : 'dash';
      if (want !== rose.airPose) { rose.airPose = want; rose.airT = 0; }
      // atterrissage : on lance la jonction juste au bon moment pour que l'image raccorde
      if (rose.vy < 0) {
        const moving = sp > 60, name = moving ? 'down' : 'drop';
        const startTop = moving ? topOf('rose_down0') : topOf('rose_lift' + (A.lift.n - 1));
        const hAt = startTop - topOf('rose_hover0');
        if (rose.y <= hAt) { rose.y = 0; rose.vy = 0; play(name, 'ground', { vx0: rose.vx }); }
      }
    } else if (a) {                                               // jonction en cours : c'est l'animation qui mène
      const n = A[a.name].n, dur = (n - 1) / FPS[a.name], k = Math.min(1, a.t / dur);
      if (a.name === 'up') { rose.vx = a.vx0 + (rose.face * FLY * .55 - a.vx0) * k * k; }
      else if (a.name === 'down') { rose.vx = a.vx0 + (rose.face * WALK * (dir ? 1 : .3) - a.vx0) * k; }
      else { rose.vx *= Math.pow(.02, dt); }
    }
    if (a) {
      a.t += dt;
      const n = A[a.name].n;
      if (a.t >= (n - 1) / FPS[a.name]) {
        rose.anim = null;
        if (a.then === 'air') {                                   // on reprend le vol exactement à la hauteur où l'animation s'arrête
          const last = 'rose_' + (A[a.name].src || a.name) + (n - 1);
          rose.y = topOf(last) - topOf('rose_hover0'); rose.vy = 120; rose.mode = 'air'; rose.airPose = Math.abs(rose.vx) < 60 ? 'hover' : 'fly'; rose.airT = 0;
        } else { rose.mode = 'ground'; rose.y = 0; if (a.name === 'down') { rose.walkDist = 0; rose.walking = Math.abs(rose.vx) > 8; } else rose.walking = false; }
      }
    }
    rose.x += rose.vx * dt;
  }

  // quelle image afficher
  function frame() {
    const a = rose.anim;
    if (a) return { ...sample(a.name, a.t * FPS[a.name]), set: a.name, ground: true };
    if (rose.mode === 'air') return { ...sample(rose.airPose, rose.airT * FPS[rose.airPose]), set: rose.airPose };
    if (rose.walking) return { ...sample('walk', rose.walkDist / STEP_PX), set: 'walk', ground: true };
    return { ...sample('idle', rose.t * FPS.idle), set: 'idle', ground: true };
  }

  // ---------- décor de la Lune ----------
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * 3000, y: Math.random(), r: Math.random() < .2 ? 2 : 1, tw: Math.random() * 6 }));
  const craters = Array.from({ length: 40 }, (_, i) => ({ x: i * 260 + Math.random() * 120, r: 30 + Math.random() * 60 }));
  function drawBg(cam, time) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e0a30'); g.addColorStop(1, '#2b2370');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { const x = ((s.x - cam * .1) % 3000 + 3000) % 3000 * (W / 1500) - 0; if (x > W) continue; ctx.globalAlpha = .55 + .45 * Math.sin(time * 2 + s.tw); ctx.fillStyle = '#fff6d8'; ctx.fillRect(x, s.y * GROUND * .9, s.r, s.r); }
    ctx.globalAlpha = 1;
    const ex = W * .78 - cam * .03, ey = H * .18, er = Math.min(W, H) * .08;   // la Terre au loin
    ctx.fillStyle = '#3b8be0'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5fc46a'; ctx.beginPath(); ctx.ellipse(ex - er * .3, ey - er * .1, er * .35, er * .25, .5, 0, Math.PI * 2); ctx.ellipse(ex + er * .35, ey + er * .3, er * .25, er * .18, -.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(ex + er * .1, ey - er * .55, er * .4, er * .1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9bccd'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#d4d6e3'; ctx.fillRect(0, GROUND, W, 6);
    for (const c of craters) { const x = (c.x - cam) % (40 * 260); const sx = ((x % 10400) + 10400) % 10400 * zoom; if (sx > W + 100) continue;
      ctx.fillStyle = '#a3a6ba'; ctx.beginPath(); ctx.ellipse(sx, GROUND + 26 + c.r * .15, c.r * zoom, c.r * .25 * zoom, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c6c8d6'; ctx.beginPath(); ctx.ellipse(sx, GROUND + 22 + c.r * .15, c.r * zoom * .85, c.r * .18 * zoom, 0, 0, Math.PI); ctx.fill(); }
  }

  function drawRose(px, py) {
    const f = frame(); if (!F[f.k]) return;
    const gy0 = f.ground ? GROUND : GROUND - rose.y * zoom;
    if (f.set !== shownSet) { if (shownSet) { fadeFrom = shown; fadeT = 0; fadeGy = lastGy; fadeLen = stopFade ? STOP_FADE : FADE; stopFade = false; } shownSet = f.set; }
    shown = f.mix > .5 ? f.k2 : f.k;
    const draw = (k, alpha, gy) => { const q = F[k]; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(px, gy); ctx.scale(rose.face * zoom, zoom);
      ctx.drawImage(img, q.x, q.y, q.w, q.h, -q.ax, -q.ay, q.w, q.h); ctx.restore(); };
    const gy = gy0;
    // ombre au sol, plus petite quand Rose est haute
    const h = f.ground ? 0 : rose.y, sh = Math.max(.25, 1 - h / 500);
    ctx.fillStyle = `rgba(40,40,80,${.28 * sh})`; ctx.beginPath(); ctx.ellipse(px, GROUND + 4, 55 * zoom * sh, 12 * zoom * sh, 0, 0, Math.PI * 2); ctx.fill();
    draw(f.k, 1, gy); if (f.mix > .01 && f.k2 !== f.k) draw(f.k2, f.mix, gy);      // fondu continu entre deux images voisines
    if (fadeFrom && fadeT < fadeLen) { const k = fadeT / fadeLen; draw(fadeFrom, 1 - k * k * (3 - 2 * k), fadeGy); } else fadeFrom = null;
    lastGy = gy;
  }
  let fadeGy = 0, lastGy = 0, shownSet = null, fadeLen = .13, stopFade = false;

  let last = performance.now(), cam = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; fadeT += dt;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GROUND = H * .74;
    if (F && img.complete) {
      update(dt);
      cam += ((rose.x - (W * .4) / zoom) - cam) * Math.min(1, dt * 4);
      drawBg(cam, now / 1000);
      drawRose((rose.x - cam) * zoom, 0);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
